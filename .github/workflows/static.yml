name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SUBMODULES: >-
    Scripts/WebGraphics
    Scripts/WebAura
    Scripts/WebAudioVisualizer
    Scripts/WebMedia
    Applications/FrostedColours
    ScrollTabs

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current site (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: current
          submodules: false
          fetch-depth: 1

      # Cache keys come from the commit SHAs the repo points at
      - name: Compute cache keys
        id: keys
        run: |
          SUB_HASH=$(git -C current ls-tree HEAD $SUBMODULES | sha256sum | cut -c1-16)
          OLD_SHA=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/old | cut -f1)
          echo "subs=$SUB_HASH" >> "$GITHUB_OUTPUT"
          echo "old=$OLD_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache submodule contents
        id: cache-subs
        uses: actions/cache@v4
        with:
          path: |
            current/Scripts/WebGraphics
            current/Scripts/WebAura
            current/Scripts/WebAudioVisualizer
            current/Scripts/WebMedia
            current/Applications/FrostedColours
            current/ScrollTabs
          key: submodules-${{ steps.keys.outputs.subs }}

      - name: Initialize submodules (only on cache miss)
        if: steps.cache-subs.outputs.cache-hit != 'true'
        working-directory: current
        run: |
          git submodule sync
          git submodule update --init --depth 1 --jobs 6 $SUBMODULES

      - name: Cache old site
        id: cache-old
        uses: actions/cache@v4
        with:
          path: oldsite
          key: oldsite-${{ steps.keys.outputs.old }}

      - name: Checkout old site (only on cache miss)
        if: steps.cache-old.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: old
          path: oldsite
          submodules: false
          fetch-depth: 1

      - name: Build Pages folder
        run: |
          mkdir -p public/old
          rsync -a --exclude='.git' --exclude='.github' current/ public/
          rsync -a --exclude='.git' oldsite/ public/old/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4