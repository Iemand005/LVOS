<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Speak</title>
	<script src="./Speech.js" defer></script>
</head>
<body>
	<label for="message">Tekst</label>
	<input id="message" type="text">
	<button id="speak">Praat</button>
	<script>
		document.getElementById("speak").addEventListener("click", function() {
			speech.say(document.getElementById("message").value);
		});
	</script>
</body>
</html>
