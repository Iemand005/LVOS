<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Photos</title>
	<style>
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			background: #111;
			overflow: hidden;
		}
		body {
			display: flex;
			align-items: center;
			justify-content: center;
		}
		#photo {
			display: block;
			max-width: 100%;
			max-height: 100%;
			object-fit: contain;
		}
	</style>
	<script src="../../Scripts/Messenger.js"></script>
</head>
<body>
	<img id="photo" alt="">
	<script>
		(function () {
			var image = document.getElementById("photo");
			var objectUrl = null;

			function show(file, path) {
				if (objectUrl) {
					URL.revokeObjectURL(objectUrl);
					objectUrl = null;
				}

				if (file && typeof file.size === "number" && typeof URL.createObjectURL === "function") {
					objectUrl = URL.createObjectURL(file);
					image.src = objectUrl;
					image.alt = file.name || "Opened image";
					return;
				}

				var source = typeof file === "string" ? file : path;
				if (source) {
					image.src = source;
					image.alt = "Opened image";
				}
			}

			LVMessenger.registerFileOpenHandler(show);
		})();
	</script>
</body>
</html>
