<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Music</title>
    <link rel="stylesheet" href="./music.css">
    <link rel="stylesheet" href="../../Styles/general.css">
    <script src="../../Scripts/CustomPrototypes.js"></script>
    <script src="../../Scripts/messenger.js"></script>
    <script src="../../Scripts/WebAudioVisualizer/AudioVisualizer.js" defer></script>
    <script src="../../Scripts/WebGraphics/Graphics.js" defer></script>
    <script src="../../Scripts/WebGraphics/Graphics2D.js" defer></script>
    <script src="../../Scripts/WebMedia/Media.js" defer></script>
    <script src="../../Scripts/WebAura/Aura.js" defer></script>
    <script src="../../Scripts/messenger.js" defer></script>
    <script src="./music.js" defer></script>

    
   
</head>
<body class="transparent">
    <audio></audio>
    <canvas id="canvas" style="width: 100%; height: 100%;"></canvas>
    <canvas id="visualizer"></canvas>
    <form id="options">
        <section>
            <input type="file" name="file" id="file" value="Open" accept="audio/*"> <!-- file -->
            <button id="mic">Microphone</button>
            <button id="display-audio">Display audio</button>
            <button id="aura-button">Connect Aura</button>
            <button id="pip-button">Open Picture In Picture</button>
            <button id="fullscreen">Fullscreen</button>
            <input min="5" step="1" max="15" type="range" name="fft" id="fft">
            <select name="style" id="style">
                <option value="bars">Bars</option>
                <option value="circle">Circle</option>
                <option value="cake">Cake</option>
            </select>
        </section>
        <section id="playcontrols">
            <section>
                <label for="volume">🔊</label>
                <input min="0" step="0.0000001" max="100" type="range" name="volume" id="volume">
                <output id="volume-output"></output>
            </section>
            <button id="play">⏵︎</button>
            <section>
                <input min="0" step="0.0000001" max="0" type="range" name="seek" id="seek">
                <output id="seek-output">&#8209;&#8209;:&#8209;&#8209;.&#8209;&#8209;</output> <!-- Non breaking hyphens! -->
            </section>
        </section>

        <button id="toggle-imgui" onclick="toggleImGui()">Debug UI (F3)</button>
    </form>


    <script>
      var canvasElement = document.getElementById("canvas"),
        Module = {
          print: (...e) => console.log(...e),
          printErr: (...e) => console.error(...e),
          canvas: canvasElement,
          /**
             * Intercepts and overrides paths for runtime dependencies (.wasm, .worker.js, etc.)
             * @param {string} path - The default filename or relative path
             * @param {string} prefix - The default folder prefix
             * @returns {string} The final resolved URL/path
             */
            locateFile: function(path, prefix) {
                return "https://iemand005.github.io/FenixWeb/Cake/" + path;
            },
          setStatus: function(text) {
            if (text) console.log(text);
          },
          monitorRunDependencies(e) {},
          onRuntimeInitialized: function() {
            // Cake boots with its main loop running; enforce the dropdown's
            // selection (default bars -> loop paused) once the module is up.
            setTimeout(syncVisualizers, 250);
          }
        };

      // Visualizer switching: "cake" shows the wasm renderer on #canvas; bars
      // and circle draw in 2D on the #visualizer overlay via music.js. Pausing
      // the wasm loop keeps the frozen cake from showing through the overlay.
      function syncVisualizers() {
        var style = document.getElementById('style');
        if (!style) return;
        var visCanvas = document.getElementById('visualizer');
        var isCake = style.value === 'cake';
        if (visCanvas) visCanvas.style.display = isCake ? 'none' : '';
        if (isCake) {
          if (typeof Module._ResumeMainLoop === 'function') Module._ResumeMainLoop();
        } else {
          if (typeof Module._PauseMainLoop === 'function') Module._PauseMainLoop();
        }
      }
      var styleEl = document.getElementById('style');
      if (styleEl) styleEl.addEventListener('change', syncVisualizers);
      syncVisualizers();

      window.onerror = () => {};

      function toggleImGui() {
        if (typeof Module._ToggleImGui === 'function') {
          Module._ToggleImGui();
          var btn = document.getElementById('toggle-imgui');
          var visible = Module._IsImGuiVisible();
          btn.classList.toggle('active', visible === 1);
        }
      }
    </script>
    <script async src="https://iemand005.github.io/FenixWeb/Cake/Cake.js"></script>
</body>
</html>
