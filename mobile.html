<body class="mobile modern android">
	<header><h1>LVOS</h1></header>
	<main>
		
		<section id="desktop">
			<section id="window-section">
				<div id="wallpaper">
					<iframe src="./Applications/FrostedColours/index.html" frameborder="0"></iframe>
				</div>
				<section id="launchpad" class="open"></section>
				<div id="main-frame"><div/>	
				
				<div class="window" id="console">
					<content>
						<header>
							<h1>Console</h1>
							<section>
								<button disabled>🡕</button>
								<button disabled>❐</button>
								<button disabled>✕</button>
							</section>
						</header>
						<article>
							<form action="">
								<input type="text" name="input" id="stdin">
								<output name="stdout" id="stdout"></output>
							</form>
						</article>
					</content>
				</div>
		</section>

	</main>
	<footer>
		<nav>
			<button id="back-button">B</button>
			<button id="home-button">H</button>
			<button id="apps-button">A</button>
		</nav>
	</footer>
</body>
