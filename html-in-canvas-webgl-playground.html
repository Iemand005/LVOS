<!DOCTYPE html>
<style>
  body { margin: 0 }
  canvas { width: 100vw; height: 100vh; display: block }
  #panel { width: 512px; height: 512px; display: grid; place-items: center;
           background: #fc0; font: 700 120px sans-serif }
</style>

<canvas id="c" layoutsubtree content="drawable">
  <iframe id="panel" src="./index.html" frameborder="0" drawable></iframe>
</canvas>

<script>
const c = document.getElementById('c'), gl = c.getContext('webgl');
c.width = innerWidth; c.height = innerHeight;
gl.viewport(0, 0, c.width, c.height);
gl.enable(gl.DEPTH_TEST);

// Shaders (rotation + perspective done in the vertex shader)
const prog = gl.createProgram();
for (const [type, src] of [
  [gl.VERTEX_SHADER, `
    attribute vec3 p; attribute vec2 t; uniform float a, asp; varying vec2 v;
    void main() {
      vec3 q = p;
      q.xz = mat2(cos(a), sin(a), -sin(a), cos(a)) * q.xz;        // spin around Y
      q.yz = mat2(cos(.5), sin(.5), -sin(.5), cos(.5)) * q.yz;    // tilt around X
      q.z -= 5.;
      v = t;
      gl_Position = vec4(q.x * 2.4 / asp, q.y * 2.4, -1.105 * q.z - 2.105, -q.z);
    }`],
  [gl.FRAGMENT_SHADER, `
    precision mediump float; uniform sampler2D s; varying vec2 v;
    void main() { gl_FragColor = texture2D(s, v); }`],
]) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh); gl.attachShader(prog, sh);
}
gl.linkProgram(prog); gl.useProgram(prog);

// Cube: 6 faces x 4 vertices (x, y, z, u, v), each face maps the whole texture
const V = [], I = [];
for (let f = 0; f < 6; f++) {
  const a = f % 3, s = f < 3 ? 1 : -1, u = (a + 1) % 3, w = (a + 2) % 3;
  for (const [x, y] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    const p = [0, 0, 0]; p[a] = s; p[u] = x; p[w] = y;
    V.push(...p, (x * s + 1) / 2, (1 - y) / 2);
  }
  I.push(f * 4, f * 4 + 1, f * 4 + 2, f * 4, f * 4 + 2, f * 4 + 3);
}
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(V), gl.STATIC_DRAW);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(I), gl.STATIC_DRAW);
for (const [name, size, offset] of [['p', 3, 0], ['t', 2, 12]]) {
  const loc = gl.getAttribLocation(prog, name);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 20, offset);
}

// Texture filled from the HTML element
gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 512, 512, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

c.onpaint = () => {
  const panel = document.getElementById('panel');
  if (gl.texElementSubImage2D) gl.texElementSubImage2D(gl.TEXTURE_2D, 0, 0, 0, panel, { width: 512, height: 512 });
  else gl.texElementImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 512, 512, 0, gl.RGBA, gl.UNSIGNED_BYTE, panel);
};
c.requestPaint();

// Draw
gl.uniform1f(gl.getUniformLocation(prog, 'asp'), c.width / c.height);
const angle = gl.getUniformLocation(prog, 'a');
(function draw(t) {
  gl.uniform1f(angle, t / 1000);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.drawElements(gl.TRIANGLES, I.length, gl.UNSIGNED_SHORT, 0);
  requestAnimationFrame(draw);
})(0);
</script>
