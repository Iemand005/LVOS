<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Speak</title>
	<link rel="stylesheet" href="speak.css">
	<link rel="stylesheet" href="../../Styles/general.css">
	<link rel="stylesheet" href="../../Styles/themes.css">
	<script src="../../Scripts/Messenger.js" defer></script>
	<script src="./Speech.js" defer></script>
	<script src="./speak.js" defer></script>
</head>
<body>
	<label for="message">Text</label>
	<input id="message" type="text">
	<button id="speak">Speak</button>

	<label for="volume">Volume</label>
	<input id="volume" type="range" min="0" max="1" step="0.05" value="1">
	<output id="volume-out" for="volume"></output>

	<label for="speed">Speed</label>
	<input id="speed" type="range" min="0.1" max="2" step="0.05" value="1">
	<output id="speed-out" for="speed"></output>

	<label for="pitch">Pitch</label>
	<input id="pitch" type="range" min="0" max="2" step="0.05" value="1">
	<output id="pitch-out" for="pitch"></output>
</body>
</html>
