<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS3 PIE Gradient Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            background-color: #f0f0f0;
        }

        .pie-button {
			display: inline-block;
			padding: 15px 30px;
			font-size: 16px;
			color: #ffffff;
			font-weight: bold;
			border: 1px solid #225588;
			cursor: pointer;

			/* 1. FIX: Dwing layout en stacking af */
			position: relative;
			z-index: 1; /* Zorgt dat de tekst vòòr de PIE-gradient blijft */
			zoom: 1;    /* Activeert hasLayout */

			border-radius: 8px;

			/* 2. FIX: IE9 gooit 'linear-gradient' weg, dus we moeten een egale kleur 
			als basis opgeven, maar we maken de normale background transparant voor IE 
			zodat de PIE-laag erdoorheen kan schijnen */
			background-color: transparent !important; 
			
			/* 3. CRUCIALAVOOR IE9 EMULATIE: Gebruik de specifieke PIE prefix */
			-pie-background: linear-gradient(#4488dd, #1144aa);
			
			/* Moderne browsers (wordt genegeerd door IE9) */
			background: linear-gradient(to bottom, #4488dd, #1144aa);

			behavior: url(https://iemand005.github.io/PIE/files/builds/2.0beta2-SNAPSHOT/PIE.htc);
		}

		/* 4. FIX: Soms tekent PIE de achtergrond met een z-index die buiten de knop valt. 
		Met deze CSS-selector pakken we het door PIE gegenereerde canvas aan */
		css3-container {
			position: absolute;
			z-index: -1 !important; /* Dwing de gradient achter de knoptekst */
			top: 0;
			left: 0;
		}

    </style>

    <!-- Laad PIE.js ALLEEN in Internet Explorer 9 en lager -->
    <!--[if lt IE 8]>
    <script type="text/javascript" src="https://iemand005.github.io/PIE/files/builds/2.0beta2-SNAPSHOT/PIE_IE9.js"></script>
    <![endif]-->
</head>
<body>

    <h1>CSS3 PIE Gradient Succes!</h1>
    <p>In moderne browsers zie je een CSS3 linear-gradient. In IE8 of IE9 zorgt PIE.js voor de magische rendering.</p>

    <button class="pie-button" id="myButton">IE-Veilige Knop</button>
